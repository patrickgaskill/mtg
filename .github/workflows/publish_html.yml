name: Publish HTML

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 9 * * *" # This will run at 09:00 UTC every day

# Limit to one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

# Define permissions explicitly
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

env:
  OUTPUT_FOLDER: ./flattened_output
  DOWNLOAD_FOLDER: ./data/downloads

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest

      - name: Download latest card data
        run: uv run mtg download

      # If the rules site is down, fall back to the committed data/rules/types.json.
      - name: Update type lists from the comprehensive rules
        continue-on-error: true
        run: uv run mtg update-types

      # Print the type lists so they can be checked (and committed) from the run log.
      - name: Show type lists
        run: cat data/rules/types.json || true

      - name: Generate reports
        run: uv run mtg run --output ${{ env.OUTPUT_FOLDER }}

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: ${{ env.OUTPUT_FOLDER }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5

      # Cards that fit a supercycle's rule but aren't listed go into one open issue,
      # updated each run and closed once nothing is left to review.
      - name: Check for new supercycle members
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Possible new supercycle members
        run: |
          uv run mtg supercycle-candidates --markdown supercycle_candidates.md
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -s supercycle_candidates.md ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file supercycle_candidates.md
            else
              gh issue create --title "$TITLE" --body-file supercycle_candidates.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "No candidates left."
          fi

      - name: Archive card data
        uses: actions/upload-artifact@v7.0.0
        with:
          name: card-data
          path: ${{ env.DOWNLOAD_FOLDER }}/*.jsonl.gz
          retention-days: 7
