name: Supercycle Scan

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays at 13:00 UTC
  workflow_dispatch:
    inputs:
      since:
        description: "Only consider cards released on/after this date (YYYY-MM-DD). Defaults to the last scan."
        required: false
        type: string

concurrency:
  group: "supercycle-scan"
  cancel-in-progress: false

permissions:
  contents: write # commit the scan state file
  issues: write # open the candidates issue

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      ISSUE_FILE: ${{ runner.temp }}/supercycle-issue.md
      ISSUE_LABEL: supercycle-candidate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Scan new cards for supercycle candidates
        id: scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          SINCE_ARG=""
          if [ -n "${{ inputs.since }}" ]; then
            SINCE_ARG="--since ${{ inputs.since }}"
          fi
          uv run supercycle_scanner.py scan --issue-file "$ISSUE_FILE" $SINCE_ARG

      - name: Open candidates issue
        if: steps.scan.outputs.candidates != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "$ISSUE_LABEL" \
            --description "Cards proposed for a supercycle by the weekly scan" \
            --color 5319E7 2>/dev/null || true
          gh issue create \
            --title "Supercycle candidates, $(date -u +%Y-%m-%d)" \
            --label "$ISSUE_LABEL" \
            --body-file "$ISSUE_FILE"

      - name: Commit scan state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manual/supercycle_scan_state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            # [skip ci] keeps this bookkeeping commit from re-running the daily publish workflow
            git commit -m "Update supercycle scan state ($(date -u +%Y-%m-%d)) [skip ci]"
            git pull --rebase
            git push
          fi
