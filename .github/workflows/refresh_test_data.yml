name: Refresh rules and test data

# Run by hand (Actions tab > Refresh rules and test data > Run workflow). Pushes
# data/rules/types.json and tests/fixtures/scryfall_sample.jsonl.gz to the
# `data-refresh` branch and opens a pull request when they changed.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Install the project
        run: uv sync

      - name: Download latest card data
        run: uv run mtg download

      - name: Update type lists from the comprehensive rules
        run: uv run mtg update-types

      - name: Cut test sample
        run: uv run mtg make-sample

      - name: Push changes and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/rules/types.json tests/fixtures/scryfall_sample.jsonl.gz
          if git diff --cached --quiet; then
            echo "Type lists and test sample are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B data-refresh
          git commit -m "Refresh rules type lists and real-card test sample"
          git push --force origin data-refresh
          gh pr create --base main --head data-refresh \
            --title "Refresh rules type lists and real-card test sample" \
            --body "Generated by the Refresh rules and test data workflow." \
            || echo "Couldn't open a pull request (it may already exist, or Actions may not be allowed to create PRs); open one from the data-refresh branch."
